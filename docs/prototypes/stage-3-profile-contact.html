<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系方式布局原型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f8fc;color:#193651;font:16px system-ui,-apple-system,"Microsoft YaHei",sans-serif}.phone{max-width:390px;margin:24px auto;border-radius:28px;overflow:hidden;box-shadow:0 12px 40px #19365115;background:#f2f8fc}.bar{background:#83c7f4;padding:19px;text-align:center;font-weight:600}.card{margin:24px 16px;padding:22px 18px;background:white;border:1px solid #dbeaf4;border-radius:20px}.label{display:block;font-weight:600;margin:0 0 10px}.field{margin-bottom:22px}.box,input,select{height:46px;background:#f9fcfe;border:1px solid #dbeaf4;border-radius:10px;color:#193651;font:inherit}.box{display:flex;align-items:center;justify-content:space-between;padding:0 14px}.row{display:flex;gap:8px;align-items:center}.type{position:relative;flex:0 0 76px}.type select{width:100%;appearance:none;padding:0 24px 0 12px;font-size:15px}.type:after{content:"";position:absolute;right:11px;top:20px;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid #74838c;pointer-events:none}input{width:0;flex:1;min-width:0;padding:0 12px;font-size:15px}input::placeholder{color:#99a6b0}.save{display:block;margin:28px auto 0;border:0;border-radius:24px;background:#83c7f4;color:#193651;height:42px;width:190px;font:600 16px system-ui}.toast{text-align:center;min-height:24px;font-size:13px;color:#657d90;padding:0 12px 15px}@media(max-width:420px){.phone{margin:0 auto;min-height:100vh;border-radius:0;box-shadow:none}}</style>
<div class="phone"><div class="bar">编辑资料</div><div class="card"><div class="field"><label class="label">昵称</label><div class="box">石耶<span>›</span></div></div><div class="field"><label class="label" for="contact">联系方式</label><div class="row"><div class="type"><select id="type" aria-label="联系方式类型"><option>微信</option><option>QQ</option><option>电话</option></select></div><input id="contact" placeholder="填写微信号，可留空" autocomplete="off"></div></div><div class="field"><label class="label">常驻校区</label><div class="box">沙河校区<span>▾</span></div></div><button class="save" id="save">保存资料</button></div><div class="toast" id="toast">布局原型 · 不保存实际资料</div></div>
<script>const type=document.getElementById('type'),contact=document.getElementById('contact');type.onchange=()=>{contact.placeholder='填写'+({微信:'微信号',QQ:'QQ号',电话:'电话号码'}[type.value])+'，可留空';contact.type=type.value==='电话'?'tel':'text'};document.getElementById('save').onclick=()=>{document.getElementById('toast').textContent='原型预览：'+type.value+' '+(contact.value||'未填写')};</script></html>
