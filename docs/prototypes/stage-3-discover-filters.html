<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第三阶段发现筛选原型</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5fa;color:#17324d;font:14px system-ui}main{max-width:420px;margin:24px auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 48px #17324d18}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:20px;margin:0}h2{font-size:14px;font-weight:600;margin:20px 0 10px}.choices{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid #dbeaf4;border-radius:9px;background:#f9fcfe;color:#53677a;padding:9px 12px;font:inherit;cursor:pointer}.on{background:#a5d7f7;border-color:#a5d7f7;color:#17324d}.range{display:flex;align-items:center;gap:10px}input{min-width:0;width:45%;padding:12px;border:1px solid #dbeaf4;border-radius:10px;font:inherit}small{display:block;margin-top:9px;color:#72808e;font-size:12px;line-height:1.5}.actions{display:flex;gap:12px;margin-top:24px}.actions button{flex:1;padding:13px}.actions .apply{flex:2;background:#83c7f4;color:#17324d}#status{padding:10px 0;line-height:1.6;font-size:12px;color:#2479b8}.close{font-size:20px;padding:3px 10px}.conditions button{white-space:normal;text-align:center}footer{max-width:420px;margin:0 auto;padding:0 20px;color:#72808e;font-size:12px}</style><main><header><h1>筛选</h1><button class="close" aria-label="关闭">×</button></header><h2>供需方向</h2><div class="choices" data-group="direction"><button class="on" data-value="">不限</button><button data-value="provide">提供</button><button data-value="need">需求</button></div><h2>内容类型</h2><div class="choices" data-group="type"><button class="on" data-value="">不限</button><button data-value="item">物品</button><button data-value="service">服务</button></div><section id="category"><h2>物品分类（可多选）</h2><div class="choices" data-group="category"><button class="on" data-value="">全部分类</button><button>数码</button><button>教材书籍</button><button>校园出行</button><button>生活用品</button><button>服饰美妆</button><button>运动娱乐</button><button>票券卡券</button><button>其他</button></div></section><h2 id="amountHeading">价格区间</h2><div class="range"><input id="min" inputmode="decimal" placeholder="最低金额" aria-label="最低金额"><span>—</span><input id="max" inputmode="decimal" placeholder="最高金额" aria-label="最高金额"></div><small>两端可同时填写，也可只填最低价或最高价。<br>设置价格区间后，仅显示填写了具体价格或预算的信息。</small><section id="condition"><h2>物品成色（可多选）</h2><div class="choices conditions" data-group="condition"><button class="on" data-value="">不限</button><button>全新未使用</button><button>几乎全新</button><button>明显使用痕迹</button><button>外观较旧，功能正常</button><button>部分功能异常</button></div><small>选择成色时自动切换为“提供物品”。</small></section><div class="actions"><button id="reset">重置</button><button class="apply" id="apply">查看结果</button></div><div id="status" role="status"></div></main><footer>交互原型：用于审阅筛选布局，不连接真实商品数据。</footer><script>const groups=[...document.querySelectorAll('[data-group]')];const get=g=>document.querySelector(`[data-group="${g}"]`);function single(g,value){for(const b of get(g).children)b.classList.toggle('on',b.dataset.value===value)}function resetMulti(g){for(const b of get(g).children)b.classList.toggle('on',b.dataset.value==='')}function selected(g){return get(g).querySelector('.on')?.dataset.value||''}function sync(){const service=selected('type')==='service';document.querySelector('#category').hidden=service;document.querySelector('#amountHeading').textContent='价格区间'}for(const group of groups)group.onclick=e=>{const b=e.target.closest('button');if(!b)return;const g=group.dataset.group;if(['direction','type'].includes(g)){single(g,b.dataset.value);if((g==='direction'&&b.dataset.value==='need')||(g==='type'&&b.dataset.value==='service'))resetMulti('condition');if(g==='type'&&b.dataset.value==='service')resetMulti('category')}else{if(b.dataset.value==='')resetMulti(g);else{b.classList.toggle('on');group.children[0].classList.toggle('on',![...group.children].slice(1).some(x=>x.classList.contains('on')));if(g==='condition'&&b.classList.contains('on')){single('direction','provide');single('type','item')}if(g==='category'&&b.classList.contains('on'))single('type','item')}}sync()};document.querySelector('#reset').onclick=()=>{single('direction','');single('type','');resetMulti('category');resetMulti('condition');document.querySelector('#min').value='';document.querySelector('#max').value='';document.querySelector('#status').textContent='';sync()};document.querySelector('#apply').onclick=()=>{const a=document.querySelector('#min').value.trim(),b=document.querySelector('#max').value.trim();const valid=x=>!x||/^\d+(\.\d{1,2})?$/.test(x)&&Number(x)<=999999.99;document.querySelector('#status').textContent=!valid(a)||!valid(b)?'请输入合法金额，最多两位小数':a&&b&&Number(a)>Number(b)?'最低金额不能高于最高金额':'原型筛选已应用，正式版将在服务端筛选后分页。'};</script></html>
