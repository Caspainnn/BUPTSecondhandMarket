<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息与站内通知原型</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5fa;color:#17324d;font:14px system-ui}main{max-width:410px;margin:24px auto;background:#f5faff;border-radius:24px;min-height:680px;position:relative;overflow:hidden;box-shadow:0 12px 48px #17324d18}header{display:flex;align-items:center;gap:12px;padding:22px 18px;background:white}h1{font-size:19px;margin:0;flex:1}button{cursor:pointer;font:inherit;border:0;color:#2479b8;background:transparent;padding:8px}section{padding:16px}.entry,.chat,.notice{background:white;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:12px}.entry{border:1px solid #dbeaf4;width:100%;text-align:left;color:#17324d}.icon{width:44px;height:44px;border-radius:14px;background:#dff1ff;display:grid;place-items:center;color:#2479b8;font-size:22px;flex:none}.copy{flex:1;min-width:0}.top{display:flex;gap:8px;align-items:center;justify-content:space-between}.name{font-weight:600}.sub{color:#72808e;font-size:12px;line-height:1.6;margin-top:6px}.badge{background:#e66b45;color:white;min-width:19px;padding:2px 6px;border-radius:99px;font-size:11px;text-align:center}.count{color:#2479b8;font-size:12px}.avatar{background:#e4f1f8;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;flex:none;color:#53677a}.tabs{display:flex;gap:8px;padding:0 16px 12px}.tabs button{flex:1;border:1px solid #dbeaf4;border-radius:10px;color:#53677a;background:#fff}.tabs .active{background:#a5d7f7;border-color:#a5d7f7;color:#17324d}.notice{display:block;position:relative;cursor:pointer}.notice.unread{border:1px solid #bfe1f8}.dot{height:7px;width:7px;border-radius:50%;background:#e66b45;display:inline-block;margin-right:6px}.tag{font-size:11px;color:#2479b8;background:#e4f4ff;padding:3px 7px;border-radius:6px;white-space:nowrap}.notice h2{font-size:14px;margin:9px 0 6px}.notice p{margin:0;color:#53677a;line-height:1.6;font-size:13px}.foot{display:flex;justify-content:space-between;margin-top:12px;color:#72808e;font-size:11px}.goto{color:#2479b8}.nav{display:flex;justify-content:space-around;background:white;padding:16px 0;margin-top:30px;color:#72808e;font-size:12px}.nav .current{color:#2479b8}.intro{max-width:410px;margin:14px auto;color:#72808e;font-size:12px;padding:0 14px;line-height:1.7}dialog{border:0;border-radius:18px;max-width:350px;width:90%;padding:22px;color:#17324d}dialog::backdrop{background:#17324d55}dialog h2{font-size:18px}.primary{background:#83c7f4;color:#17324d;border-radius:10px;width:100%;padding:12px}.empty{padding:40px;text-align:center;color:#72808e}[hidden]{display:none!important}</style><main><div id="messages"><header><h1>消息</h1></header><section><button class="entry" id="open"><span class="icon">♧</span><span class="copy"><span class="top"><span class="name">系统通知</span><span class="badge" id="entryUnread"></span></span><span class="sub" style="display:block">预约动态与提醒</span><span class="count" id="todoSummary"></span></span><span>›</span></button><div class="chat"><div class="avatar">李</div><div class="copy"><div class="top"><span class="name">李同学</span><span class="sub">高等数学教材</span></div><div class="sub">好的，我们图书馆门口见。</div></div><span class="badge">2</span></div><div class="chat"><div class="avatar">王</div><div class="copy"><div class="top"><span class="name">王同学</span><span class="sub">自行车维修</span></div><div class="sub">明天下午可以帮你检查。</div></div></div></section><div class="nav"><span>发现</span><span>发布</span><span class="current">消息 <b id="navCount"></b></span><span>我的</span></div></div><div id="notifications" hidden><header><button id="back" aria-label="返回">‹ 返回</button><h1>系统通知</h1><button id="readAll">全部已读</button></header><div class="tabs"><button data-tab="all" class="active">全部</button><button data-tab="todo">待处理 <span id="todoCount"></span></button></div><section id="list"></section></div></main><p class="intro">交互原型：点系统通知进入列表，点通知查看对应预约。读取通知不会结束待办；在预约里完成操作后，待办才消失。示例不连接真实数据。</p><dialog id="detail"><h2 id="detailTitle"></h2><p id="detailText" style="line-height:1.7;color:#53677a"></p><p class="sub">正式版将进入对应预约，可在现有预约卡片上处理。</p><button class="primary" id="resolve">模拟完成预约操作</button><button id="close" style="width:100%;margin-top:8px">返回通知</button></dialog><script>const rows=[{id:1,title:'待确认预约',post:'高等数学教材',text:'买家发起了预约，请查看并确认清单。',time:'今天 14:20',read:false,todo:true,action:'去确认'},{id:2,title:'交接结果待确认',post:'自行车维修',text:'对方已确认交接成功，请提交你的交接结果。',time:'今天 14:10',read:false,todo:true,action:'去反馈'},{id:3,title:'预约即将开始',post:'二手台灯',text:'即将到约定时间，请按约定地点交接。',time:'今天 13:45',read:false,todo:false,action:'查看预约'},{id:4,title:'交易已自动完成',post:'计算机网络教材',text:'约定时间已过一小时，无失败反馈，交易已自动完成。',time:'昨天 19:30',read:true,todo:false,action:'查看结果'},{id:5,title:'预约已取消',post:'羽毛球拍',text:'本次预约已取消，可与对方重新协商。',time:'昨天 16:20',read:true,todo:false,action:'查看预约'}];let tab='all',current;const $=id=>document.getElementById(id);function render(){const unread=rows.filter(x=>!x.read).length,todos=rows.filter(x=>x.todo).length;$('entryUnread').textContent=unread;$('entryUnread').hidden=!unread;$('todoSummary').textContent=todos?'待处理 '+todos+' 项':'暂无待处理事项';$('todoCount').textContent=todos?'('+todos+')':'';$('navCount').textContent=unread+2;const visible=rows.filter(x=>tab!=='todo'||x.todo);$('list').innerHTML=visible.length?visible.map(x=>`<article class="notice ${x.read?'':'unread'}" tabindex="0" role="button" data-id="${x.id}"><div class="top"><span class="name">${x.read?'':'<span class="dot"></span>'}${x.title}</span>${x.todo?'<span class="tag">待处理</span>':''}</div><h2>${x.post}</h2><p>${x.text}</p><div class="foot"><span>${x.time}</span><span class="goto">${x.action} ›</span></div></article>`).join(''):'<div class="empty">暂无待处理事项</div>'}function openDetail(target){const element=target.closest('[data-id]');if(!element)return;current=rows.find(x=>x.id===Number(element.dataset.id));current.read=true;render();$('detailTitle').textContent=current.post;$('detailText').textContent=current.text;$('resolve').hidden=!current.todo;$('detail').showModal()}$('open').onclick=()=>{$('messages').hidden=true;$('notifications').hidden=false};$('back').onclick=()=>{$('messages').hidden=false;$('notifications').hidden=true};$('readAll').onclick=()=>{rows.forEach(x=>x.read=true);render()};document.querySelector('.tabs').onclick=e=>{const button=e.target.closest('[data-tab]');if(!button)return;tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));render()};$('list').onclick=e=>openDetail(e.target);$('list').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(e.target)}};$('close').onclick=()=>$('detail').close();$('resolve').onclick=()=>{current.todo=false;current.text='对应预约操作已处理。';current.action='查看预约';render();$('detail').close()};render();</script></html>
